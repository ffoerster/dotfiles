# =============================================================================
# Tmux Configuration
# =============================================================================

# -----------------------------------------------------------------------------
# Terminal and Color Settings
# -----------------------------------------------------------------------------
# Enable 256-color and true-color (24-bit) support in tmux
# Using screen-256color for better SSH compatibility
set -g default-terminal "screen-256color"
# Override to enable true-color for compatible terminals
set -ga terminal-overrides ",*256col*:Tc"
set -ga terminal-overrides ",xterm-*:Tc"
set -ga terminal-overrides ",ghostty:Tc"

# -----------------------------------------------------------------------------
# General Settings
# -----------------------------------------------------------------------------
# Use external clipboard handling (prevents hanging with text selection)
# The tmux-yank plugin will handle clipboard operations
set -g set-clipboard external
# Don't exit tmux when closing the last session
set -g detach-on-destroy off
# Remove delay for exiting insert mode with ESC in Neovim
set -g escape-time 0
# Increase scrollback history size (default: 2000)
set -g history-limit 100000
# Update status bar every 3 seconds (default: 15)
set -g status-interval 3
# Allow programs in panes to bypass tmux (e.g., for image previews)
set -g allow-passthrough on
# Enable focus events for better terminal integration
set -g focus-events on
# Position status bar at bottom
set -g status-position bottom
# Enable mouse support for scrolling and pane selection
set -g mouse on

# -----------------------------------------------------------------------------
# Window and Pane Settings
# -----------------------------------------------------------------------------
# Start window numbering at 1 instead of 0
set -g base-index 1
# Start pane numbering at 1 for consistency
set -g pane-base-index 1
set-window-option -g pane-base-index 1
# Automatically renumber windows when one is closed
set -g renumber-windows on
# Automatically rename windows based on current program
set-window-option -g automatic-rename on
set-option -g set-titles on

# -----------------------------------------------------------------------------
# Key Bindings
# -----------------------------------------------------------------------------
# Change prefix from Ctrl-b to Ctrl-a
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# Reload tmux configuration
unbind r
bind r \
	source-file ~/.config/tmux/tmux.conf \;\
	display 'Reloaded tmux config'

# Pane navigation (vim-style)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Pane navigation (Alt + arrow keys)
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Window navigation (Shift + arrow keys)
bind -n S-Left previous-window
bind -n S-Right next-window

# Pane resizing
bind D resize-pane -D 8  # Make pane 8 lines smaller
bind U resize-pane -U 4  # Make pane 4 lines taller

# Split windows (open in current directory)
unbind '"'
unbind %
bind '|' split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Vi-mode for copy mode
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# -----------------------------------------------------------------------------
# Status Bar Configuration
# -----------------------------------------------------------------------------
# Status bar lengths
set -g status-left-length 30
set -g status-right-length 150
set-option -g status "on"

# Status bar colors
set-option -g status-style bg=colour237,fg=colour223  # bg=bg1, fg=fg1

# Window status colors
set-window-option -g window-status-style bg=colour214,fg=colour237  # bg=yellow, fg=bg1
set-window-option -g window-status-activity-style bg=colour237,fg=colour248  # bg=bg1, fg=fg3
set-window-option -g window-status-current-style bg=red,fg=colour237  # fg=bg1

# Pane border colors
set-option -g pane-active-border-style fg=colour214
set-option -g pane-border-style fg=colour239

# Message colors
set-option -g message-style bg=colour239,fg=colour223  # bg=bg2, fg=fg1
set-option -g message-command-style bg=colour239,fg=colour223  # bg=fg3, fg=bg1

# Pane number display colors
set-option -g display-panes-active-colour colour1  # fg2
set-option -g display-panes-colour colour237  # bg1

# Clock color
set-window-option -g clock-mode-colour colour109  # blue

# Bell colors
set-window-option -g window-status-bell-style bg=colour167,fg=colour235  # bg=red, fg=bg

# Status bar content
set-option -g status-left "\
#[fg=colour7, bg=colour241]#{?client_prefix,#[bg=colour167],} ❐ #S \
#[fg=colour241, bg=colour237]#{?client_prefix,#[fg=colour167],}#{?window_zoomed_flag, 🔍,}"

set-option -g status-right "\
#[fg=colour214, bg=colour237] \
#[fg=colour237, bg=colour214] #(tmux-spotify-info) \
#[fg=colour223, bg=colour237] #{battery_status_bg} Batt: #{battery_icon} #{battery_percentage} \
#[fg=colour246, bg=colour237]  %b %d '%y\
#[fg=colour109]  %H:%M \
#[fg=colour248, bg=colour239]"

# Window status format
set-window-option -g window-status-current-format "\
#[fg=colour237, bg=colour214]\
#[fg=colour239, bg=colour214] #I* \
#[fg=colour239, bg=colour214, bold] #W \
#[fg=colour214, bg=colour237]"

set-window-option -g window-status-format "\
#[fg=colour237,bg=colour239,noitalics]\
#[fg=colour223,bg=colour239] #I \
#[fg=colour223, bg=colour239] #W \
#[fg=colour239, bg=colour237]"

# -----------------------------------------------------------------------------
# Plugins
# -----------------------------------------------------------------------------
# Catppuccin theme flavor
set -g @catppuccin_flavour 'mocha'  # options: frappe, macchiato, mocha

# Plugin list
set -g @plugin 'catppuccin/tmux'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'ofirgall/tmux-window-name'
set -g @plugin 'kiyoon/treemux'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'robhurring/tmux-uptime'
set -g @plugin 'tmux-plugins/tmux-battery'

# Treemux configuration
set -g @treemux-tree-nvim-init-file '~/.config/tmux/plugins/treemux/configs/treemux_init.lua'

# Initialize TPM (Tmux Plugin Manager) - keep this at the bottom
run '~/.config/tmux/plugins/tpm/tpm'

# -----------------------------------------------------------------------------
# Reference: Tmux Variables and Formatting
# -----------------------------------------------------------------------------
# Common variables for status bar customization:
# $(echo $USER) - Current username
# %a - Day of week abbreviated (Mon)
# %A - Day of week full (Monday)
# %b - Month abbreviated (Jan)
# %d - Day (31)
# %Y - Year (2017)
# %D - Month/Day/Year (12/31/2017)
# %v - Day-Month-Year (31-Dec-2017)
# %r - 12-hour time with AM/PM (12:30:27 PM)
# %T - 24-hour time (16:30:27)
# %R - 24-hour time without seconds (16:30)
# %H - 24-hour hour (16)
# %M - Minutes (30)
# %S - Seconds (09)
# %p - AM/PM indicator
#
# Window/pane variables:
# #H - Hostname
# #I - Window index
# #P - Pane index
# #S - Session name
# #T - Pane title
# #W - Current program/command
#
# For complete list: https://linux.die.net/man/3/strftime
#
# Color reference (Catppuccin Mocha):
# colour0 (black)    colour8 (bright black)
# colour1 (red)      colour9 (bright red)
# colour2 (green)    colour10 (bright green)
# colour3 (yellow)   colour11 (bright yellow)
# colour4 (blue)     colour12 (bright blue)
# colour5 (magenta)  colour13 (bright magenta)
# colour6 (cyan)     colour14 (bright cyan)
# colour7 (white)    colour15 (bright white)
