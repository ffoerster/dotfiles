# Arch Linux specific packages

# ============================================================================
# REMOVAL SECTION
# ============================================================================
# Packages to be removed/uninstalled (cleanup unwanted packages)
# Removal happens BEFORE installation

remove:
  pacman: []
  # Example: - old-package

  aur: []
  # Example: - unused-aur-package

# ============================================================================
# INSTALLATION SECTION
# ============================================================================

# Official repositories (pacman)
pacman:
  # Base development
  - base-devel
  - git
  - curl
  - wget
  - unzip
  - tar
  - bash
  - bash-completion
  - tmux
  - neovim
  - htop
  - tree

  # Modern CLI tools
  - starship
  - ripgrep
  - fd
  - bat
  - eza
  - zoxide
  - fzf
  - jq
  - bandwhich

  # Development
  - docker
  - docker-compose
  - ansible
  - python
  - python-pip
  - nodejs
  - npm

  # System utilities
  - openssh
  - man-db
  - man-pages
  - fastfetch

# AUR packages (requires paru or yay)
aur:
  - 1password
  - 1password-cli
  # Add AUR-only packages here
  # - spotify
  # - visual-studio-code-bin
  # - slack-desktop

# Optional: packages for desktop/GUI systems only
# (use conditional in install script)
gui_packages:
  - firefox
  - alacritty
  # - kitty
  # - wezterm
