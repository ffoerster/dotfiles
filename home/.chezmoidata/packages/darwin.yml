# macOS-specific packages (Homebrew)
# Imported from Brewfile

# ============================================================================
# REMOVAL SECTION
# ============================================================================
# Packages to be removed/uninstalled (cleanup unwanted packages)
# Add packages here that you want to remove from your system
# Removal happens BEFORE installation

remove:
  brews: []
  # Example: - old-package
  # Example: - unused-tool

  casks:
    - spotify
    - jetbrains-toolbox
    - tower
    - transmit
    - meetily
    - openra
    - arc
    - archivebox/archivebox
    - affinity-designer
    - affinity-photo
    - affinity-publisher
  # Example: - old-app

  fonts: []
  # Example: - font-old-font

# ============================================================================
# INSTALLATION SECTION
# ============================================================================

# Homebrew taps (additional repositories)
taps:
  - homebrew/cask-fonts
  - ddev/ddev
  - emmercm/igir
  - esolitos/ipa
  - felixkratz/formulae
  - garfieldius/taps
  - koekeishiya/formulae
  - rhettbull/osxphotos
  - sikarugir-app/sikarugir
  - supabase/tap

