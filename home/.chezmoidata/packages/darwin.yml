# Mac App Store apps (requires 'mas' CLI)
mas_apps:
  - id: 1569813296
    name: "1Password for Safari"
  - id: 1465180184
    name: "GeoTag"
  - id: 1295203466
    name: "Microsoft Remote Desktop"
